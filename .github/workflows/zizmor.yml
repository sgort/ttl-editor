name: Supply-chain audit

# Deliberately NO branches filter on pull_request, and none on paths either.
# The audit must run on EVERY pull request, whatever it changes and whatever
# it targets -- both filters are the same hole in different dimensions: paths
# lets a pull request skip the gate by touching nothing watched, branches lets
# it skip by targeting a base that is not watched.
#
# The branches variant is the nastier of the two. `audit` is a required status
# check in the "acc supply-chain gate" ruleset, which applies only while the
# base IS acc. So a stacked pull request -- one based on a feature branch --
# matched no trigger, accumulated no audit, and still reported CLEAN with zero
# checks. It read as ready and was not. The moment its parent merged, GitHub
# auto-retargeted it to acc, the ruleset started applying, the required check
# was missing, and the pull request blocked permanently: a retarget emits no
# pull_request event, so nothing ever backfilled it. (Escape hatch, if one is
# ever stuck this way: `gh pr close <n> && gh pr reopen <n>` -- `reopened` is
# in the default types set and by then the base is acc.)
#
# Cost is one extra ~40s read-only run per feature-branch-targeting pull
# request. push stays filtered: acc and main are the only branches whose
# post-merge state is worth re-auditing.
#
# Do NOT copy this shape into azure-static-web-apps-*.yml. Those carry a
# branches filter for the opposite reason and fail in the opposite direction:
# an absent filter on the AUDIT makes a required check silently missing, while
# an absent filter on a DEPLOY makes a scarce environment silently exhausted.
# ronl-business-api hit that on 2026-08-28 -- five open pull requests against
# a three-environment Static Web Apps ceiling. This repository has TWO Static
# Web Apps filtered to different branches (orange-beach on acc, white-sky on
# main), so unfiltering them would claim two staging slots per pull request
# and let an acc-targeting pull request stage on the production app.
# Audit widely, deploy narrowly.
on:
  # The default types only (opened, synchronize, reopened), deliberately NOT
  # labeled/unlabeled. A pull request opened with labels (every Renovate pull
  # request) would start two runs on one commit. This workflow has no
  # concurrency group, so here every check would simply run twice; in
  # linked-data-explorer, whose workflow cancels a run in progress, the
  # ruleset read the cancelled audit and lockfile-review as failed and
  # blocked the merge (#368 there, 2026-11-27). Renovate's `security` label
  # arrives a second or so after `opened`, so the dependency gate waits for
  # Renovate's labels through the API instead of a second run.
  pull_request:
  push:
    branches:
      - acc
      - main

# Read-only: the audit inspects the tree and needs nothing else.
permissions:
  contents: read

jobs:
  zizmor:
    name: audit
    runs-on: ubuntu-24.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node 24 for the config validator
        # renovate@44.50.3 declares engines.node ^24.11.0; the runner's
        # default is Node 22. npm accepts that with an EBADENGINE warning
        # rather than refusing, so the validator ran unsupported and green
        # -- the kind of mismatch that keeps working until it abruptly
        # does not. Reuses the setup-node pin this repository already
        # carries, so Renovate maintains one digest rather than two.
        #
        # Placed BEFORE the zizmor step deliberately: a step after a
        # failing one is skipped, and the validator's `if: always()`
        # would then run on whatever Node the runner defaulted to.
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          # Exact, like .nvmrc, and deliberately its own literal: this step
          # needs Node 24 whatever the application runs on. Same version as
          # .nvmrc today; Renovate's node manager keeps both current.
          node-version: '24.22.2'
          # For the `npm ci` the formatting check needs, further down.
          cache: 'npm'
      - name: Run zizmor
        uses: zizmorcore/zizmor-action@45d7276c9ca790aabd705e31ca99c6185c3e76dd # v0.8.1
        with:
          # The action's `version` input defaults to "latest". Pinning it is
          # the whole point of this exercise — and it keeps CI's findings
          # identical to the local baseline this plan was measured against.
          # Renovate-maintained after all: its github-actions manager maps this
          # action's `version` input to the Docker image
          # ghcr.io/zizmorcore/zizmor (lib/modules/manager/github-actions/
          # known-actions.ts), so a zizmor release arrives as its own pull
          # request. That bump only runs once the action pinned above lists the
          # new version in its digest table -- 1.30.1 is in v0.6.4's, not
          # v0.6.3's -- so merge the zizmor-action update first. See
          # SECURITY-PIPELINE.md, "Pinned".
          version: '1.29.0'
          # advanced-security uploads SARIF, which needs security-events:
          # write. This job is contents: read only, so it must be false.
          advanced-security: false
          annotations: true
          online-audits: false
          # Leave `token` at its default. Setting it to '' looks like sound
          # least-privilege hardening, but zizmor's --gh-token is env-backed
          # and clap rejects a set-but-empty value before any audit runs,
          # even with online-audits: false:
          #   error: invalid value '' for '--gh-token <GH_TOKEN>'
          # The default is ${{ github.token }}, scoped to contents: read and
          # mounted read-only, so the exposure it would have removed is
          # negligible anyway.

      - name: Validate renovate.json
        # Runs even when zizmor fails, so a single run reports on both halves
        # of the policy rather than the first failure hiding the second.
        if: always()
        # Pinned like everything else here. A supply-chain check that fetched a
        # floating version of its own tool would be self-defeating. Renovate's
        # npm manager will NOT maintain this for us -- it is an inline npx
        # argument, not a manifest entry -- so it is bumped by hand, alongside
        # the zizmor version above.
        #
        # --strict also fails on configuration Renovate would silently
        # auto-migrate. That is deliberate: it is how `baseBranches`, renamed
        # upstream to `baseBranchPatterns`, was caught in linked-data-explorer
        # rather than living on as a deprecated key that still "worked".
        #
        # No filename argument. Passing one switches the validator into global
        # config mode, which applies different rules than the repository config
        # this file actually is -- it will happily validate and tell you
        # nothing useful.
        run: npx --yes --package renovate@44.50.3 renovate-config-validator --strict

      - name: Lockfile matches package.json
        # `npm ci` refuses to install when package-lock.json and package.json
        # disagree, so this was already detectable -- but only as an EUSAGE
        # error inside "Install dependencies for the formatter", three steps
        # into a job about pinning, where nobody reads it as a lockfile
        # problem. It happened on 2026-09-25: three dependency pull requests
        # merged back to back, each with a lockfile computed against an older
        # acc, produced a lockfile matching no package.json (sgort/ronl-business-api#225).
        #
        # --dry-run resolves and validates without writing node_modules, so
        # this costs seconds and fails with the cause in its own name.
        #
        # What it CANNOT do: the check runs on this pull request's merge
        # commit, so it proves the lockfile is consistent with THIS base. A
        # pull request that is green against a stale base and merges into a
        # moved one is not caught here -- nothing on the pull request can catch
        # that. Merge dependency pull requests one at a time, and rebase each
        # onto the merged acc first.
        #
        # if: always() for the same reason as the steps around it -- one run
        # should report on every half of the policy.
        if: always()
        # --ignore-scripts because a dry run never creates node_modules, and the
        # root postinstall (scripts/write-deps-marker.mjs) copies the lockfile
        # into it: without this the step fails ENOENT on a clean checkout and
        # reads as a lockfile problem, which is precisely the confusion it
        # exists to remove. Lifecycle scripts have no bearing on whether the
        # lockfile satisfies package.json.
        run: npm ci --dry-run --ignore-scripts

      - name: Install dependencies for the formatter
        # The only step in this job that needs node_modules. Everything above
        # runs from npx or plain node, which is why the audit had no install
        # at all until formatting joined it.
        #
        # It has to be THIS repository's prettier, not a version named in the
        # workflow. linked-data-explorer#45 exists because prettier 3.7 -> 3.9
        # changed how short union types are formatted: five untouched files
        # started failing `prettier --check` the moment the bump merged, with
        # every CI check green, and the symptom would have been the next
        # person's `git push` failing on files they had never opened. An
        # `npx prettier@<pinned>` here would be a second version to keep in
        # step with package.json -- reintroducing exactly the drift the check
        # exists to catch. npm ci costs install time and cannot drift.
        #
        # cache: 'npm' is set on the setup-node step above so this restores
        # rather than resolves. The audit is a required check on every pull
        # request and pays this cost every time.
        if: always()
        run: npm ci
      - name: Check formatting
        # Here rather than in the deploy workflows, which carry
        # `paths-ignore: docs/**, **/*.md` and would therefore never check the
        # files most likely to drift. Prettier formats markdown, and
        # lint-staged only covers src/** and package.json, so a documentation
        # change is currently formatted by nothing before it lands and the
        # first person to feel it is whoever next runs `git push`.
        #
        # `prettier --check .` from the root is right here: one package, one
        # .prettierignore, and it is the same command .husky/pre-push runs. Do
        # NOT copy linked-data-explorer's per-workspace fan-out -- that exists
        # because .prettierignore resolves relative to the working directory
        # and a root run there would silently check dist/ and coverage/.
        #
        # if: always() for the same reason as the validator above -- a zizmor
        # failure should not hide a formatting failure behind it.
        if: always()
        run: npm run check-format

      - name: Verify registry signatures
        # ICTU recommendation R5, "verify where packages come from" (#249 in
        # linked-data-explorer). Checks the registry signature of every
        # installed package, and the provenance attestation of those that have
        # one, so it needs the npm ci above; it adds no install of its own.
        # Here and not in the daily dependency audit: a signature can only
        # change when package-lock.json does, and every such change comes
        # through a pull request, where this job is required.
        #
        # Fails on an invalid or missing signature, and on a registry gap (an
        # advertised attestation that returns 404, after which npm checks
        # nothing more). A package without an attestation passes. The reasons
        # and the fix for a gap are in scripts/audit-signatures.sh.
        #
        # if: always() for the same reason as the checks above.
        if: always()
        run: npm run audit:signatures

      - name: Verify pin truth and register agreement
        # The third half of the policy, and the one zizmor structurally cannot
        # cover. zizmor validates pin FORMAT -- that a `uses:` names a
        # 40-character SHA. It cannot say the SHA is the RIGHT one, so a wrong
        # or hostile digest carrying a plausible "# v7.0.1" comment passes
        # zizmor, Prettier and review alike. This resolves every digest against
        # the GitHub API and compares SECURITY-PIPELINE.md's Pinned table with
        # the workflows.
        #
        # if: always() for the same reason as the validator above -- one run
        # should report on every half of the policy, not stop at the first.
        if: always()
        #
        # BLOCKING from the outset, unlike the adoptions downstream.
        #
        # linked-data-explorer and ronl-business-api both landed this
        # non-blocking, because Renovate rewrites workflow pins and never
        # touches SECURITY-PIPELINE.md -- so an action bump fails the register
        # half until the register is updated by hand, and blocking on that
        # would fail a required check on routine dependency updates.
        #
        # That is answered rather than avoided: update the register ON the
        # bump's branch, before merging. Proven in linked-data-explorer over
        # two bumps (sgort/linked-data-explorer#66, #67), which is why this
        # repository does not need to repeat the non-blocking phase. See
        # SECURITY-PIPELINE.md, "Keeping this register true".
        #
        # The known cost: this puts a network call inside a job the ruleset
        # requires, so a GitHub API outage or rate limit can fail a gate
        # unrelated to the change under review. It is 4 calls for 11
        # references -- results are deduplicated per action and version -- and
        # the script reports transport failure as a finding rather than
        # passing quietly. If it ever proves flaky, add --offline: that keeps
        # register agreement blocking and drops only the network-dependent
        # half. Do NOT reach for continue-on-error instead; it rewrites the
        # STEP's reported conclusion as well as the job's, so a finding
        # becomes visible only in this log while the checks list, the job and
        # the step all read "success".
        env:
          # contents: read suffices -- this only resolves public refs.
          GITHUB_TOKEN: ${{ github.token }}
        run: npm run check-supply-chain

  # What a dependency pull request's lockfile change contains (#248, ICTU R9).
  # A reviewer is shown `prettier ^3.9.7 -> ^3.9.8`; what moves is
  # package-lock.json, and nobody reads that diff. Required on acc: it runs
  # on every pull request, because this workflow has no paths filter, and
  # succeeds at once when the lockfile is unchanged -- so it can be required
  # without the never-reports trap.
  #
  # Two jobs, for the trust boundary: this one runs code from the head ref
  # (the script and the lockfile) with a READ-ONLY token; the comment job
  # holds the write token and runs no repository code at all.
  #
  # The dependency gate (scripts/dependency-gate.mjs) runs in this same job,
  # not a new one: a new required check would need a ruleset change, and the
  # comment job already carries one report per pull request. It blocks a new
  # direct dependency that fails the criteria without a register entry, and a
  # lockfile version younger than the cooldown; see
  # docs/superpowers/specs/2026-11-27-dependency-register-gate-design.md in
  # linked-data-explorer.
  lockfile-review:
    name: lockfile-review
    if: github.event_name == 'pull_request'
    runs-on: ubuntu-24.04
    permissions:
      contents: read
      # The gate asks whether the issue an override or a cooldown exception
      # cites is still open (spec §4.4), and, for a pull request by Renovate,
      # who put the `security` label on it: both through the issues API, which
      # answers for pull requests too. Read-only, like the rest of the job.
      issues: read
      # The issues endpoints for a pull request's number may need it with the installation token.
      pull-requests: read
    outputs:
      changed: ${{ steps.diff.outputs.changed }}
      report: ${{ steps.diff.outputs.report }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Set up Node
        uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24.22.2'
      - name: Test the lockfile diff
        # Tested where it runs, like promotion-targets.test.mjs.
        run: node scripts/lockfile-diff.test.mjs
      - name: Test the dependency gate
        # Before the comparison step, which exits early on an unchanged
        # lockfile: a malformed register must fail the check even then
        # (spec §4.4), or it would sit broken until the next lockfile change.
        run: |
          node scripts/dependency-gate.test.mjs
          node scripts/dependency-gate.mjs --check-register
      - name: Compare package-lock.json with the base
        id: diff
        env:
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
          # Values reach the script through the environment only, never
          # interpolated into the shell. The token is read-only (see the job's
          # permissions). The author and number let the gate ask the API
          # whether renovate[bot] labelled this pull request `security`, which
          # logs a young version instead of blocking it; the payload's labels
          # are not used, because they are stale on the run that matters.
          GITHUB_TOKEN: ${{ github.token }}
          PR_AUTHOR: ${{ github.event.pull_request.user.login }}
          PR_NUMBER: ${{ github.event.pull_request.number }}
        run: |
          git fetch --no-tags --depth=1 origin "$BASE_SHA"
          if git diff --quiet "$BASE_SHA" HEAD -- package-lock.json; then
            echo "changed=false" >> "$GITHUB_OUTPUT"
            echo "package-lock.json is unchanged by this pull request." >> "$GITHUB_STEP_SUMMARY"
            exit 0
          fi
          echo "changed=true" >> "$GITHUB_OUTPUT"
          # A pull request that adds the first lockfile has none at the base:
          # compare against an empty one, so it reads as "everything added"
          # instead of failing the step with no report (#248 final review).
          if git cat-file -e "$BASE_SHA:package-lock.json" 2> /dev/null; then
            git show "$BASE_SHA:package-lock.json" > "$RUNNER_TEMP/base-lock.json"
          else
            echo '{"lockfileVersion":3,"packages":{}}' > "$RUNNER_TEMP/base-lock.json"
          fi
          status=0
          node scripts/lockfile-diff.mjs "$RUNNER_TEMP/base-lock.json" package-lock.json \
            --config lockfile-review.json \
            --out "$RUNNER_TEMP/report.md" || status=$?
          # The gate runs whatever the diff said, so one comment shows both
          # findings; the step then fails on the larger status. On exit 2 the
          # gate writes its own "could not run" section, saying why.
          gate_status=0
          node scripts/dependency-gate.mjs "$RUNNER_TEMP/base-lock.json" package-lock.json \
            --config lockfile-review.json \
            --out "$RUNNER_TEMP/gate.md" || gate_status=$?
          if [ ! -f "$RUNNER_TEMP/gate.md" ]; then
            # No report means the gate did not run, whatever its status said.
            gate_status=2
            printf '#### Dependency gate\n\n**✗ The dependency gate could not run** — the check fails. See the job log.\n' > "$RUNNER_TEMP/gate.md"
          fi
          # One report: the gate's section right under the verdict, so cutting
          # it to fit a comment never cuts the gate, and no "✓ No blocking
          # findings" above a gate that blocks. It starts with the marker the
          # comment job finds it by. A failure here fails the step (exit 2).
          GATE_STATUS="$gate_status" node -e '
            const fs = require("fs");
            import("./scripts/dependency-gate.mjs").then(({ combineComment }) => {
              const t = process.env.RUNNER_TEMP;
              const read = (f) => (fs.existsSync(f) ? fs.readFileSync(f, "utf8") : "");
              const { summary, comment } = combineComment(
                read(t + "/report.md"), read(t + "/gate.md"), Number(process.env.GATE_STATUS));
              fs.writeFileSync(t + "/summary.md", summary);
              fs.writeFileSync(t + "/comment.md", comment);
            }).catch((e) => { console.error(e); process.exit(2); });
          '
          cat "$RUNNER_TEMP/summary.md" >> "$GITHUB_STEP_SUMMARY"
          # A delimiter per run, so no report content can end the value early.
          delim="EOF_$(openssl rand -hex 16)"
          { echo "report<<$delim"; cat "$RUNNER_TEMP/comment.md"; echo; echo "$delim"; } >> "$GITHUB_OUTPUT"
          if [ "$gate_status" -gt "$status" ]; then status=$gate_status; fi
          exit "$status"

  lockfile-review-comment:
    name: lockfile-review-comment
    needs: lockfile-review
    # !cancelled(), not always(): a red check still gets the comment that says
    # why, but a run superseded by a newer push does not overwrite the newer
    # report with its own (#248 final review). A report must exist: an empty
    # body would fail the job and leave the previous comment standing. Same-
    # repo branches only: a fork's token is read-only, and its summary suffices.
    if: >-
      !cancelled() && github.event_name == 'pull_request' &&
      needs.lockfile-review.outputs.changed == 'true' &&
      needs.lockfile-review.outputs.report != '' &&
      github.event.pull_request.head.repo.full_name == github.repository
    runs-on: ubuntu-24.04
    permissions:
      pull-requests: write
    steps:
      - name: Post or update the lockfile review comment
        # No checkout: this job runs no repository code. The report arrives
        # through env, never ${{ }} inside the script (template injection).
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          REPORT: ${{ needs.lockfile-review.outputs.report }}
        run: |
          marker='<!-- lockfile-review -->'
          id=$(gh api --paginate "repos/$REPO/issues/$PR/comments" \
            --jq ".[] | select(.user.login == \"github-actions[bot]\" and (.body | startswith(\"$marker\"))) | .id" | head -n1)
          if [ -n "$id" ]; then
            gh api --method PATCH "repos/$REPO/issues/comments/$id" -f body="$REPORT" > /dev/null
          else
            gh api --method POST "repos/$REPO/issues/$PR/comments" -f body="$REPORT" > /dev/null
          fi
