name: Deploy PROD (white-sky)

# Deploys are filtered by paths-ignore, not paths.
#
# An allowlist (`paths:`) would mean enumerating every path that affects the
# build. ttl-editor is a single package, not a monorepo, so there is no natural
# boundary to enumerate, and anything forgotten SILENTLY SKIPS A DEPLOY -- a far
# worse failure than one unnecessary preview. RBA and LDE can use `paths:`
# because `packages/frontend/**` is a real boundary there; copying that pattern
# into this repository would be the obvious move and the wrong one.
#
# So the default stays "deploy", and only what demonstrably cannot affect the
# built app is excluded. A documentation-only pull request now gets no preview
# environment at all, which is the point -- it was claiming a staging slot from
# a ceiling of ten and returning nothing for it. See #52.
#
# GitHub Actions does not support YAML anchors, so the list is repeated rather
# than shared. Keep the two copies identical.
#
# The branches filter below stays narrow deliberately -- see the comment above
# `on:` in zizmor.yml. The audit must run on every pull request; a deploy must
# not, because each one claims a staging environment on a bounded pool.
#
# Preview environments are closed by close-preview-environments.yml, not here.
# A close job in this workflow inherited the path filter above, so a pull
# request whose files all matched it never started that job when it closed.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened]
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-24.04
    name: Build and deploy PROD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false
      - name: Setup Node.js
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          # Read from .nvmrc, an exact version, so there is one place this
          # repository states its Node. Until sgort/linked-data-explorer#119
          # this was a bare '24' that governed lint and tests only, because
          # Oryx built the shipped bundle on a Node it chose itself (22.22.0 in
          # run 34622800899). Now the runner builds, so this pin decides what
          # ships. Renovate's nvm manager maintains the file.
          node-version-file: .nvmrc
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true
      # The bundle is built HERE, from the tree `npm ci` installed and on the
      # Node the tests just ran on, and uploaded as-is with skip_app_build.
      # Until sgort/linked-data-explorer#119 the deploy action built it: Oryx
      # ran `npm install` inside the floating staticappsclient:stable
      # container, re-resolving the lockfile's ranges on a Node this repository
      # never chose, and downloading PHP and Composer it does not use. So the
      # code that passed the tests and the code that shipped were two different
      # builds. ICTU recommendations 2, 3 and 4.
      - name: Build
        env:
          # Vite only exposes variables prefixed VITE_ to the client bundle.
          # This overrides the value in .env.production, which vite build also
          # loads -- do not remove it expecting .env.acceptance to take over,
          # because nothing loads that file without --mode acceptance.
          VITE_BACKEND_URL: https://backend.linkeddata.open-regels.nl
          # Build provenance, surfaced in the Changelog tab. The version
          # there is bumped by hand and identifies a release, not a build of
          # it: ACC and PROD can serve different builds of the same version,
          # and a redeploy of unchanged code produces a new artifact carrying
          # the same version string. The SHA says what was built; the run
          # number distinguishes two builds of identical code.
          #
          # Passed in rather than derived from git at build time, so the build
          # id has exactly one source. That was a necessity while Oryx built
          # in its own container, where .git was not guaranteed; the rule
          # stays. A build id that silently failed to resolve would be worse
          # than none.
          VITE_BUILD_SHA: ${{ github.sha }}
          VITE_BUILD_RUN: ${{ github.run_number }}
        run: |
          npm run build
          test -f dist/index.html || { echo "::error::dist/index.html not found after build"; exit 1; }
      - name: Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_SKY_02B674303 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          # With skip_app_build, app_location is the built output itself. vite
          # build emits dist/; a stale path here uploads an empty directory
          # and reports SUCCESS, which the index.html check above guards.
          app_location: '/dist'
          api_location: ''
          output_location: ''
          skip_app_build: true
