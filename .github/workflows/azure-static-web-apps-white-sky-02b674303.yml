name: Deploy PROD (white-sky)

# Deploys are filtered by paths-ignore, not paths.
#
# An allowlist (`paths:`) would mean enumerating every path that affects the
# build. ttl-editor is a single package, not a monorepo, so there is no natural
# boundary to enumerate, and anything forgotten SILENTLY SKIPS A DEPLOY -- a far
# worse failure than one unnecessary preview. RBA and LDE can use `paths:`
# because `packages/frontend/**` is a real boundary there; copying that pattern
# into this repository would be the obvious move and the wrong one.
#
# So the default stays "deploy", and only what demonstrably cannot affect the
# built app is excluded. A documentation-only pull request now gets no preview
# environment at all, which is the point -- it was claiming a staging slot from
# a ceiling of ten and returning nothing for it. See #52.
#
# GitHub Actions does not support YAML anchors, so the list is repeated rather
# than shared. Keep the two copies identical.
#
# The branches filter below stays narrow deliberately -- see the comment above
# `on:` in zizmor.yml. The audit must run on every pull request; a deploy must
# not, because each one claims a staging environment on a bounded pool.
on:
  push:
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'
  pull_request:
    types: [opened, synchronize, reopened, closed]
    branches:
      - main
    paths-ignore:
      - 'docs/**'
      - '.claude/**'
      - '**/*.md'

# Default to read-only; jobs opt into more only where required.
permissions:
  contents: read

jobs:
  build_and_deploy_job:
    if: github.event_name == 'push' || (github.event_name == 'pull_request' && github.event.action != 'closed')
    permissions:
      contents: read
      pull-requests: write
    runs-on: ubuntu-latest
    name: Build and deploy PROD
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: true
          lfs: false
          persist-credentials: false
      # The Static Web Apps action builds inside its own container and runs none
      # of our scripts, so lint and the test suite get explicit steps ahead of
      # it. Before this, nothing anywhere — hook or pipeline — stopped a deploy
      # that broke the suite.
      - name: Setup Node.js 20
        uses: actions/setup-node@820762786026740c76f36085b0efc47a31fe5020 # v7.0.0
        with:
          node-version: '24'
          cache: 'npm'
      - name: Install dependencies
        run: npm ci
      - name: Run linter
        run: npm run lint
      - name: Unit tests
        run: npm run test:ci
        env:
          CI: true
      - name: Build And Deploy
        id: builddeploy
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_SKY_02B674303 }}
          repo_token: ${{ secrets.GITHUB_TOKEN }} # Used for Github integrations (i.e. PR comments)
          action: 'upload'
          ###### Repository/Build Configurations - These values can be configured to match your app requirements. ######
          # For more information regarding Static Web App workflow configurations, please visit: https://aka.ms/swaworkflowconfig
          app_location: '/' # App source code path
          api_location: '' # Api source code path - optional
          output_location: 'dist' # Built app content directory - optional
          # vite build emits dist/; react-scripts emitted build/. These two
          # must move together with the build script -- a stale value here
          # uploads an empty directory and reports SUCCESS.
        env:
          # Vite only exposes variables prefixed VITE_ to the client bundle.
          # This overrides the value in .env.production, which vite build also
          # loads -- do not remove it expecting .env.acceptance to take over,
          # because nothing loads that file without --mode acceptance.
          VITE_BACKEND_URL: https://backend.linkeddata.open-regels.nl
          ###### End of Repository/Build Configurations ######

  close_pull_request_job:
    if: github.event_name == 'pull_request' && github.event.action == 'closed'
    permissions: {}
    runs-on: ubuntu-latest
    name: Close PROD staging environment
    steps:
      - name: Close Pull Request
        id: closepullrequest
        uses: Azure/static-web-apps-deploy@4d27395796ac319302594769cfe812bd207490b1 # v1
        with:
          azure_static_web_apps_api_token: ${{ secrets.AZURE_STATIC_WEB_APPS_API_TOKEN_WHITE_SKY_02B674303 }}
          action: 'close'
