<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Tic Tac Toe</title>
  <style>
    * { box-sizing: border-box; margin: 0; padding: 0; }
    body {
      font-family: sans-serif;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      background: #1a1a2e;
      color: #eee;
    }
    h1 { font-size: 2rem; margin-bottom: 1rem; letter-spacing: 2px; }
    #status {
      font-size: 1.2rem;
      margin-bottom: 1.5rem;
      min-height: 1.5em;
      color: #a8dadc;
    }
    #board {
      display: grid;
      grid-template-columns: repeat(3, 100px);
      grid-template-rows: repeat(3, 100px);
      gap: 8px;
      margin-bottom: 1.5rem;
    }
    .cell {
      background: #16213e;
      border: 2px solid #0f3460;
      border-radius: 8px;
      font-size: 2.8rem;
      font-weight: bold;
      display: flex;
      align-items: center;
      justify-content: center;
      cursor: pointer;
      transition: background 0.15s;
      user-select: none;
    }
    .cell:hover:not(.taken) { background: #0f3460; }
    .cell.x { color: #e94560; }
    .cell.o { color: #a8dadc; }
    .cell.win { background: #0f3460; outline: 3px solid #e94560; }
    .buttons { display: flex; gap: 1rem; }
    button {
      padding: 0.6rem 1.4rem;
      font-size: 1rem;
      border: none;
      border-radius: 6px;
      cursor: pointer;
      font-weight: bold;
      transition: opacity 0.15s;
    }
    button:hover { opacity: 0.85; }
    #btnNew { background: #e94560; color: #fff; }
    #btnStop { background: #444; color: #ccc; }
  </style>
</head>
<body>
  <h1>Tic Tac Toe</h1>
  <div id="status">Press "New Game" to start</div>
  <div id="board">
    <div class="cell" data-i="0"></div>
    <div class="cell" data-i="1"></div>
    <div class="cell" data-i="2"></div>
    <div class="cell" data-i="3"></div>
    <div class="cell" data-i="4"></div>
    <div class="cell" data-i="5"></div>
    <div class="cell" data-i="6"></div>
    <div class="cell" data-i="7"></div>
    <div class="cell" data-i="8"></div>
  </div>
  <div class="buttons">
    <button id="btnNew">New Game</button>
    <button id="btnStop">Stop</button>
  </div>

  <script>
    const WINS = [[0,1,2],[3,4,5],[6,7,8],[0,3,6],[1,4,7],[2,5,8],[0,4,8],[2,4,6]];
    let board, current, active;

    const cells = document.querySelectorAll('.cell');
    const status = document.getElementById('status');

    function newGame() {
      board = Array(9).fill(null);
      current = 'X';
      active = true;
      cells.forEach(c => { c.textContent = ''; c.className = 'cell'; });
      status.textContent = "Player X's turn";
    }

    function stopGame() {
      active = false;
      cells.forEach(c => c.classList.add('taken'));
      status.textContent = 'Game stopped.';
    }

    function checkWin(player) {
      return WINS.find(combo => combo.every(i => board[i] === player)) || null;
    }

    cells.forEach(cell => {
      cell.addEventListener('click', () => {
        const i = +cell.dataset.i;
        if (!active || board[i]) return;
        board[i] = current;
        cell.textContent = current;
        cell.classList.add(current.toLowerCase(), 'taken');

        const winCombo = checkWin(current);
        if (winCombo) {
          winCombo.forEach(j => cells[j].classList.add('win'));
          status.textContent = `Player ${current} wins!`;
          active = false;
          return;
        }
        if (board.every(v => v)) {
          status.textContent = "It's a draw!";
          active = false;
          return;
        }
        current = current === 'X' ? 'O' : 'X';
        status.textContent = `Player ${current}'s turn`;
      });
    });

    document.getElementById('btnNew').addEventListener('click', newGame);
    document.getElementById('btnStop').addEventListener('click', stopGame);
  </script>
</body>
</html>
